// HeliumFox: open new tabs on a local start page (this first line must stay a comment).
// 1. Replace the path below with the full path to your start page's index.html
//    (use forward slashes, keep the file:/// prefix).
// 2. Copy this file into the Firefox install folder (e.g. C:\Program Files\Mozilla Firefox\).
// 3. Copy autoconfig.js into its defaults\pref\ folder.
// Undo: delete both files again. New-tab extensions (like Bonjourr) take priority, so
// disable those first.
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = "file:///C:/path/to/simple-start/index.html";
} catch (e) {
  Components.utils.reportError(e);
}
